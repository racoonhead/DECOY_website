<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DECØY DEVICES — Detail modulu</title>
  <meta name="description" content="Technické specifikace, dokumentace, fotogalerie a dostupnost produktu DECØY DEVICES." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261123g" />
</head>
<body id="productBody" class="product-page">
  <a class="skip-link" href="#productMain">Přejít na obsah / Skip to content</a>
  <div id="fxOverlay" class="fx-overlay" aria-hidden="true"></div>

  <!-- Šipky v gradient pozadí produktu po stranách obrazovky -->
  <button id="pagePrevArrow" class="bg-nav-arrow bg-nav-prev page-bg-arrow" type="button" aria-label="Předchozí produkt">
    <span class="bg-arrow-glyph">‹</span>
    <span id="pagePrevLabel" class="bg-arrow-label"></span>
  </button>
  <button id="pageNextArrow" class="bg-nav-arrow bg-nav-next page-bg-arrow" type="button" aria-label="Další produkt">
    <span id="pageNextLabel" class="bg-arrow-label"></span>
    <span class="bg-arrow-glyph">›</span>
  </button>

  <header class="hud-nav product-nav">
    <div class="container hud-nav-inner">
      <div class="nav-left">
        <a id="backToDivLink" href="index.html" class="btn-back">
          <span>←</span>
          <span id="backToDivLabel">DECØY DEVICES</span>
        </a>
      </div>

      <div id="topProductPager" class="prod-top-pager" aria-label="Listování mezi produkty">
        <!-- Populated by product.js -->
      </div>

      <div class="nav-right">
        <button id="cartToggleProd" class="btn-hud btn-sm" type="button" aria-expanded="false" aria-controls="cartDrawer">
          <span data-i18n="list_btn">SEZNAM</span>
          <span class="cart-count-pill">[<span data-cart-count>0</span>]</span>
        </button>
      </div>
    </div>
  </header>

  <main id="productMain" tabindex="-1">
    <!-- Populated by product.js -->
  </main>

  <footer id="siteFooter" class="pcb-footer">
    <!-- Populated by renderModuleFooterHTML() according to GRAPHIC_MANUAL.md -->
  </footer>

  <!-- LIGHTBOX PRO ZVĚTŠENÍ OBRÁZKU / DIAGRAMU -->
  <div id="imgLightbox" class="img-lightbox" hidden aria-modal="true" role="dialog">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Zavřít">✕</button>
    <button type="button" class="lightbox-arrow lightbox-prev" id="lightboxPrev" aria-label="Předchozí obrázek">‹</button>
    <figure class="lightbox-figure">
      <img id="lightboxImg" src="" alt="" />
      <figcaption id="lightboxCap" class="lightbox-cap"></figcaption>
    </figure>
    <button type="button" class="lightbox-arrow lightbox-next" id="lightboxNext" aria-label="Další obrázek">›</button>
  </div>

  <!-- HUD SEZNAM / POPTÁVKA -->
  <aside id="cartDrawer" class="cart-drawer" hidden aria-modal="true" role="dialog" aria-labelledby="cartDrawerTitle">
    <div class="cart-backdrop" data-close-cart></div>
    <div class="cart-panel">
      <div class="cart-header">
        <h2 id="cartDrawerTitle" data-i18n="cart_title">NÁKUPNÍ SEZNAM &amp; POPTÁVKA</h2>
        <button type="button" class="modal-close" data-close-cart aria-label="Zavřít">✕</button>
      </div>
      <div id="cartDrawerBody" class="cart-body"></div>
    </div>
  </aside>

  <div class="landing-bottombar">
    <button id="langToggleProd" class="btn-hud btn-sm" type="button">
      <span class="lang-active">CZ</span> / <span>EN</span>
    </button>
  </div>

  <script src="data.js?v=20261123g"></script>
  <script src="product.js?v=20261123g"></script>
</body>
</html>
