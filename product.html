<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DECØY — Detail produktu</title>
  <meta name="description" content="Detailní technická specifikace, dokumentace, fotogalerie a dostupnost produktu DECØY." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261122g" />
</head>
<body id="productBody" class="product-page">
  <a class="skip-link" href="#productMain">Přejít na obsah / Skip to content</a>

  <header class="site-header product-nav">
    <div class="container header-inner">
      <div class="header-left">
        <a href="index.html#home" class="brand-logo" aria-label="DECØY Domů">
          <span class="brand-mark" aria-hidden="true">Ø</span>
          <span class="brand-text">
            <strong>DECØY</strong>
            <small>DEVICES // CATALOG</small>
          </span>
        </a>
        <a id="backToDivLink" href="index.html#products" class="btn-back">
          <span>←</span>
          <span id="backToDivLabel">KATALOG</span>
        </a>
      </div>

      <nav class="main-nav" aria-label="Hlavní navigace">
        <a href="index.html#products" class="nav-link active" data-i18n="nav_products">PRODUKTY</a>
        <a href="index.html#brands" class="nav-link" data-i18n="nav_brands">ZNAČKY</a>
        <a href="index.html#originals" class="nav-link" data-i18n="nav_originals">DECØY ORIGINALS</a>
        <a href="index.html#teatro" class="nav-link nav-link-teatro" data-i18n="nav_teatro">TEATRO\\\SVJÖTLO</a>
        <a href="index.html#support" class="nav-link" data-i18n="nav_support">PODPORA</a>
        <a href="index.html#about" class="nav-link" data-i18n="nav_about">O ZNAČCE</a>
      </nav>

      <div class="header-actions">
        <div id="topProductPager" class="prod-top-pager" aria-label="Listování mezi produkty"></div>
        <button id="cartToggleBtn" class="btn-hud btn-cart" type="button" aria-expanded="false" aria-controls="cartDrawer">
          <span data-i18n="cart_btn">POPTÁVKA / KOŠÍK</span>
          <span id="cartCountBadge" class="cart-badge">0</span>
        </button>
        <button id="langToggleProd" class="btn-hud btn-sm" type="button" aria-label="Přepnout jazyk">
          <span class="lang-active">CZ</span> / <span>EN</span>
        </button>
      </div>
    </div>
  </header>

  <button id="pagePrevArrow" class="bg-nav-arrow bg-nav-prev page-bg-arrow" type="button" aria-label="Předchozí produkt">
    <span class="bg-arrow-glyph">‹</span>
    <span id="pagePrevLabel" class="bg-arrow-label"></span>
  </button>
  <button id="pageNextArrow" class="bg-nav-arrow bg-nav-next page-bg-arrow" type="button" aria-label="Další produkt">
    <span id="pageNextLabel" class="bg-arrow-label"></span>
    <span class="bg-arrow-glyph">›</span>
  </button>

  <main id="productMain" tabindex="-1"></main>

  <footer id="siteFooter" class="site-footer"></footer>

  <!-- LIGHTBOX PRO ZVĚTŠENÍ OBRÁZKU / DIAGRAMU -->
  <div id="imgLightbox" class="img-lightbox" hidden aria-modal="true" role="dialog">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Zavřít">✕</button>
    <button type="button" class="lightbox-arrow lightbox-prev" id="lightboxPrev" aria-label="Předchozí obrázek">‹</button>
    <figure class="lightbox-figure">
      <img id="lightboxImg" src="" alt="" />
      <figcaption id="lightboxCap" class="lightbox-cap"></figcaption>
    </figure>
    <button type="button" class="lightbox-arrow lightbox-next" id="lightboxNext" aria-label="Další obrázek">›</button>
  </div>

  <!-- CART / INQUIRY DRAWER -->
  <aside id="cartDrawer" class="cart-drawer" hidden aria-modal="true" role="dialog" aria-labelledby="cartDrawerTitle">
    <div class="cart-backdrop" data-close-cart></div>
    <div class="cart-panel">
      <div class="cart-header">
        <h2 id="cartDrawerTitle" data-i18n="cart_title">NÁKUPNÍ SEZNAM &amp; POPTÁVKA</h2>
        <button type="button" class="modal-close" data-close-cart aria-label="Zavřít">✕</button>
      </div>
      <div id="cartDrawerBody" class="cart-body"></div>
    </div>
  </aside>

  <script src="data.js?v=20261122g"></script>
  <script src="product.js?v=20261122g"></script>
</body>
</html>
