<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <style>
      .bg { fill: #0a0e10; }
      .card { fill: #111619; stroke: rgba(185, 190, 199, 0.22); stroke-width: 1; }
      .card-hi { fill: #111619; stroke: rgba(110, 168, 199, 0.45); stroke-width: 1; }
      .title { font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif; font-weight: 500; fill: #eaeae4; letter-spacing: 0.08em; }
      .block-name { font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif; font-weight: 600; font-size: 18px; fill: #eaeae4; letter-spacing: 0.08em; }
      .mono { font-family: 'JetBrains Mono', monospace; font-weight: 400; fill: #b9bec7; font-size: 10px; }
      .mono-sm { font-family: 'JetBrains Mono', monospace; font-weight: 400; fill: #8b949e; font-size: 9px; }
      .mono-acc { font-family: 'JetBrains Mono', monospace; font-weight: 500; fill: #6ea8c7; font-size: 9.5px; }
      .mono-mod { font-family: 'JetBrains Mono', monospace; font-weight: 500; fill: #d1b379; font-size: 9.5px; }
      .sig-solid { fill: none; stroke: #6ea8c7; stroke-width: 1.5; }
      .sig-dashed { fill: none; stroke: #d1b379; stroke-width: 1.3; stroke-dasharray: 4 3; }
      .reg { font-family: 'JetBrains Mono', monospace; fill: #b9bec7; font-size: 12px; opacity: 0.45; }
    </style>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6ea8c7"/>
    </marker>
    <marker id="arrow-mod" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d1b379"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="620"/>
  <rect x="16" y="16" width="1068" height="588" fill="none" stroke="rgba(185, 190, 199, 0.2)" stroke-width="1"/>
  <text class="reg" x="24" y="34">+</text><text class="reg" x="1068" y="34">+</text>
  <text class="reg" x="24" y="596">+</text><text class="reg" x="1068" y="596">+</text>

  <text class="mono-acc" x="48" y="44">DD-AU01 // THE IN</text>
  <text class="title" x="48" y="70" font-size="22">AUDIO, CV, MIDI &amp; USB INPUT PIPELINE</text>
  <text class="mono-sm" x="1052" y="44" text-anchor="end">16 HP · 24-BIT / 48 KHZ</text>
  <line x1="48" y1="84" x2="1052" y2="84" stroke="rgba(185, 190, 199, 0.24)" stroke-width="1"/>

  <!-- Left Column: Analog & Digital Inputs -->
  <g transform="translate(48, 108)">
    <rect class="card" x="0" y="0" width="290" height="104"/>
    <text class="mono-acc" x="14" y="20">CH1 // MIC / LINE</text>
    <text class="block-name" x="14" y="42">XLR / TRS COMBO</text>
    <text class="mono-sm" x="14" y="64">• +48 V switchable phantom</text>
    <text class="mono-sm" x="14" y="80">• −20 dB PAD · HPF · Gain + Clip LED</text>

    <rect class="card" x="0" y="120" width="290" height="96"/>
    <text class="mono-acc" x="14" y="140">CH2 // INSTRUMENT</text>
    <text class="block-name" x="14" y="162">HI-Z GUITAR / BASS</text>
    <text class="mono-sm" x="14" y="184">• 6.35 mm TS · HI-Z / LINE switch</text>
    <text class="mono-sm" x="14" y="200">• Direct rack entry without DI box</text>

    <rect class="card" x="0" y="232" width="290" height="84"/>
    <text class="mono-acc" x="14" y="252">CH3 &amp; CH4 // STEREO</text>
    <text class="block-name" x="14" y="274">LINE IN L / R (3.5 MM)</text>
    <text class="mono-sm" x="14" y="296">• Input attenuators · 24-bit A/D (~110 dB)</text>

    <rect class="card" x="0" y="332" width="290" height="132"/>
    <text class="mono-mod" x="14" y="352">CONTROL &amp; SYNC</text>
    <text class="block-name" x="14" y="374">CV · GATE · MIDI</text>
    <text class="mono-sm" x="14" y="396">• 4× CV IN (±10.24 V, 16-bit, 1 MΩ)</text>
    <text class="mono-sm" x="14" y="412">• 4× GATE · CLK IN · RST IN</text>
    <text class="mono-sm" x="14" y="428">• MIDI IN (DIN-5 + 3.5 mm TRS opto)</text>
  </g>

  <!-- Routing Arrows Left -> Center -->
  <line class="sig-solid" x1="338" y1="160" x2="412" y2="250" marker-end="url(#arrow-acc)"/>
  <line class="sig-solid" x1="338" y1="276" x2="412" y2="286" marker-end="url(#arrow-acc)"/>
  <line class="sig-solid" x1="338" y1="382" x2="412" y2="330" marker-end="url(#arrow-acc)"/>
  <line class="sig-dashed" x1="338" y1="506" x2="412" y2="390" marker-end="url(#arrow-mod)"/>

  <!-- Center: Core DSP & OLED -->
  <g transform="translate(416, 178)">
    <rect class="card-hi" x="0" y="0" width="268" height="296"/>
    <text class="mono-acc" x="16" y="24">CORE ENGINE</text>
    <text class="block-name" x="16" y="48">24-BIT / 48 KHZ DSP</text>

    <rect x="16" y="68" width="236" height="72" fill="#090c0e" stroke="rgba(185,190,199,0.2)"/>
    <text class="mono-acc" x="28" y="88">OLED 1.54" (128×64)</text>
    <text class="mono-sm" x="28" y="106">SELECT encoder · MENU · CAL</text>
    <text class="mono-sm" x="28" y="122">Level metering &amp; routing matrix</text>

    <rect x="16" y="156" width="236" height="120" fill="#090c0e" stroke="rgba(185,190,199,0.18)"/>
    <text class="mono" x="28" y="178">Signal conditioning:</text>
    <text class="mono-sm" x="28" y="198">• Audio A/D: 24-bit / 48 kHz</text>
    <text class="mono-sm" x="28" y="216">• CV A/D: 16-bit @ up to 500 kS/s</text>
    <text class="mono-sm" x="28" y="234">• Envelope &amp; pitch extraction</text>
    <text class="mono-sm" x="28" y="252">• Firmware update via microSD</text>
  </g>

  <!-- Routing Arrows Center -> Right -->
  <line class="sig-solid" x1="684" y1="230" x2="758" y2="176" marker-end="url(#arrow-acc)"/>
  <line class="sig-solid" x1="684" y1="326" x2="758" y2="326" marker-end="url(#arrow-acc)"/>
  <line class="sig-dashed" x1="684" y1="418" x2="758" y2="474" marker-end="url(#arrow-mod)"/>

  <!-- Right Column: Outputs & Storage -->
  <g transform="translate(762, 108)">
    <rect class="card" x="0" y="0" width="290" height="134"/>
    <text class="mono-acc" x="14" y="20">OUT 01 // EURORACK</text>
    <text class="block-name" x="14" y="42">MODULAR AUDIO &amp; CV</text>
    <text class="mono-sm" x="14" y="64">• Amplified mic/guitar at ±5 V rack level</text>
    <text class="mono-sm" x="14" y="80">• MIDI-to-CV &amp; clock conversion</text>
    <text class="mono-sm" x="14" y="96">• Backing track / .mid playback into rack</text>

    <rect class="card" x="0" y="154" width="290" height="134"/>
    <text class="mono-acc" x="14" y="174">OUT 02 // USB-C</text>
    <text class="block-name" x="14" y="196">AUDIO &amp; MIDI INTERFACE</text>
    <text class="mono-sm" x="14" y="218">• USB 2.0 FS Audio Class + MIDI</text>
    <text class="mono-sm" x="14" y="234">• Bidirectional stream with DAW</text>
    <text class="mono-sm" x="14" y="250">• Single-cable clock, notes &amp; audio</text>

    <rect class="card" x="0" y="308" width="290" height="156"/>
    <text class="mono-mod" x="14" y="328">OUT 03 // MICROSD</text>
    <text class="block-name" x="14" y="350">STANDALONE RECORDER</text>
    <text class="mono-sm" x="14" y="372">• Direct WAV recording (24-bit / 48 kHz)</text>
    <text class="mono-sm" x="14" y="388">• Plays .wav, .mid, and .clk files</text>
    <text class="mono-sm" x="14" y="404">• Computer-free rehearsal &amp; stage capture</text>
  </g>
</svg>
