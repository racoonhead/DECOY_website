  <text class="mono" x="826" y="264">CV 2   → 1V/Oct melodic voice 2</text>
  <text class="mono" x="826" y="286">CV 3   → 1V/Oct melodic voice 3</text>
  <text class="mono" x="826" y="308">MOD CV → Modulation CV output</text>
