  <text class="mono-sm" x="402" y="497">• Scale Select: 54 LEDs = 54 preset scales</text>
  <text class="mono-sm" x="402" y="515">• TRAV (9): Faces U/D/F/B/L/R (1–9) · PND/SNK/RND (1–54)</text>
