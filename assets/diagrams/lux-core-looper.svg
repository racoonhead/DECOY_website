<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <style>
      .bg { fill: #0a0e10; }
      .card { fill: #111619; stroke: rgba(185, 190, 199, 0.22); stroke-width: 1; }
      .card-hi { fill: #111619; stroke: rgba(84, 199, 204, 0.45); stroke-width: 1; }
      .title { font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif; font-weight: 500; fill: #eaeae4; letter-spacing: 0.08em; }
      .block-name { font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif; font-weight: 600; font-size: 18px; fill: #eaeae4; letter-spacing: 0.08em; }
      .mono { font-family: 'JetBrains Mono', monospace; font-weight: 400; fill: #b9bec7; font-size: 10px; }
      .mono-sm { font-family: 'JetBrains Mono', monospace; font-weight: 400; fill: #8b949e; font-size: 9px; }
      .mono-acc { font-family: 'JetBrains Mono', monospace; font-weight: 500; fill: #54c7cc; font-size: 9.5px; }
      .mono-mod { font-family: 'JetBrains Mono', monospace; font-weight: 500; fill: #d1b379; font-size: 9.5px; }
      .wave-acc { fill: none; stroke: #54c7cc; stroke-width: 1.5; }
      .wave-mod { fill: none; stroke: #d1b379; stroke-width: 1.5; }
      .sig-solid { fill: none; stroke: #54c7cc; stroke-width: 1.5; }
      .sig-dashed { fill: none; stroke: #d1b379; stroke-width: 1.3; stroke-dasharray: 4 3; }
      .reg { font-family: 'JetBrains Mono', monospace; fill: #b9bec7; font-size: 12px; opacity: 0.45; }
    </style>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#54c7cc"/>
    </marker>
    <marker id="arrow-mod" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d1b379"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="620"/>
  <rect x="16" y="16" width="1068" height="588" fill="none" stroke="rgba(185, 190, 199, 0.2)" stroke-width="1"/>
  <text class="reg" x="24" y="34">+</text><text class="reg" x="1068" y="34">+</text>
  <text class="reg" x="24" y="596">+</text><text class="reg" x="1068" y="596">+</text>

  <text class="mono-acc" x="48" y="44">DD-LC01 // LUX_CORE</text>
  <text class="title" x="48" y="70" font-size="22">DMX TAPE LOOPER &amp; FIXTURE-AWARE INTERPOLATION</text>
  <text class="mono-sm" x="1052" y="44" text-anchor="end">14 HP · 200 HZ INTERPOLATION</text>
  <line x1="48" y1="84" x2="1052" y2="84" stroke="rgba(185, 190, 199, 0.24)" stroke-width="1"/>

  <!-- Left: Inputs -->
  <g transform="translate(48, 108)">
    <rect class="card" x="0" y="0" width="260" height="136"/>
    <text class="mono-acc" x="14" y="20">IN 01 // DMX IN (XLR-3)</text>
    <text class="block-name" x="14" y="42">DESK / CONSOLE</text>
    <text class="mono-sm" x="14" y="64">• Galvanically isolated 512 ch</text>
    <text class="mono-sm" x="14" y="80">• Record live moving-head cues</text>
    <text class="mono-sm" x="14" y="96">• 44 or 88 frames/sec capture</text>

    <rect class="card" x="0" y="154" width="260" height="136"/>
    <text class="mono-acc" x="14" y="174">IN 02 // PATCH RJ45</text>
    <text class="block-name" x="14" y="196">MODULAR PATCHBAY</text>
    <text class="mono-sm" x="14" y="218">• Direct link from CUE_FRAMES</text>
    <text class="mono-sm" x="14" y="234">• Merge LFOs on top of recorded</text>
    <text class="mono-sm" x="14" y="250">  fixture trajectories</text>

    <rect class="card" x="0" y="308" width="260" height="156"/>
    <text class="mono-mod" x="14" y="328">IN 03 // 3×3 CV MATRIX</text>
    <text class="block-name" x="14" y="350">TIME &amp; TRANSPORT CV</text>
    <text class="mono-sm" x="14" y="372">• CLK · REC · SPEED · START · LEN</text>
    <text class="mono-sm" x="14" y="388">• BLEND · DIM CV · FIXT CV</text>
    <text class="mono-sm" x="14" y="404">• 8× ±10 V · EOC +5 V trigger out</text>
  </g>

  <line class="sig-solid" x1="308" y1="176" x2="366" y2="236" marker-end="url(#arrow-acc)"/>
  <line class="sig-solid" x1="308" y1="330" x2="366" y2="330" marker-end="url(#arrow-acc)"/>
  <line class="sig-dashed" x1="308" y1="494" x2="366" y2="416" marker-end="url(#arrow-mod)"/>

  <!-- Center: Loop Buffer & Fixture Profile -->
  <g transform="translate(370, 108)">
    <rect class="card-hi" x="0" y="0" width="380" height="464"/>
    <text class="mono-acc" x="16" y="22">CORE // TAPE LOOPER + PROFILE ENGINE</text>
    <text class="block-name" x="16" y="46">SPEED −200% … 0 … +200%</text>

    <rect x="16" y="64" width="348" height="114" fill="#090c0e" stroke="rgba(185,190,199,0.18)"/>
    <text class="mono-sm" x="26" y="82">LOOP BUFFER (25 MS – 120 S · CROSSFADE 0–500 MS)</text>
    <path class="wave-acc" d="M 28 152 Q 86 92 146 138 T 266 112 T 346 144"/>
    <line x1="110" y1="88" x2="110" y2="164" stroke="#d1b379" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="250" y1="88" x2="250" y2="164" stroke="#d1b379" stroke-width="1" stroke-dasharray="3 3"/>
    <text class="mono-mod" x="114" y="166">START</text>
    <text class="mono-mod" x="254" y="166">LENGTH</text>

    <!-- Fixture Profile Comparison -->
    <rect x="16" y="194" width="348" height="162" fill="#090c0e" stroke="rgba(84,199,204,0.3)"/>
    <text class="mono-acc" x="26" y="214">FIXTURE-AWARE INTERPOLATION (200 HZ)</text>
    <text class="mono" x="26" y="238">Pan / Tilt / Dimmer (16-bit):</text>
    <path class="wave-acc" d="M 26 266 Q 110 242 210 264"/>
    <text class="mono-sm" x="224" y="264">smooth curve</text>

    <text class="mono" x="26" y="294">Gobo / Color Wheel:</text>
    <path class="wave-mod" d="M 26 324 H 90 V 306 H 150 V 324 H 210"/>
    <text class="mono-sm" x="224" y="320">clean slot snap</text>
    <text class="mono-sm" x="26" y="346">microSD stores fixture profiles &amp; loop banks</text>

    <rect x="16" y="372" width="348" height="74" fill="#090c0e" stroke="rgba(185,190,199,0.18)"/>
    <text class="mono" x="26" y="394">MERGE MODES:</text>
    <text class="mono-acc" x="26" y="416">HTP · LTP · BLEND CV · ADDITIVE · MASK</text>
  </g>

  <line class="sig-solid" x1="750" y1="330" x2="808" y2="330" marker-end="url(#arrow-acc)"/>

  <!-- Right: DMX Output -->
  <g transform="translate(812, 198)">
    <rect class="card-hi" x="0" y="0" width="240" height="260"/>
    <text class="mono-acc" x="16" y="24">STAGE OUTPUT</text>
    <text class="block-name" x="16" y="48">DMX OUT (XLR-3)</text>
    <text class="mono-sm" x="16" y="76">• Galvanically isolated RS-485</text>
    <text class="mono-sm" x="16" y="94">• 512 channels @ 250 kbit/s</text>
    <text class="mono-sm" x="16" y="112">• Reverse, freeze &amp; slow-mo</text>
    <text class="mono-sm" x="16" y="130">• Fan delays across fixtures</text>

    <rect x="16" y="156" width="208" height="84" fill="#090c0e" stroke="rgba(185,190,199,0.2)"/>
    <text class="mono" x="26" y="178">Transport buttons:</text>
    <text class="mono-acc" x="26" y="200">REC · PLAY · DUB · CLR</text>
    <text class="mono-sm" x="26" y="220">OLED + PROF &amp; PATCH</text>
  </g>
</svg>
