<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <style>
      .bg { fill: #f2f2ee; }
      .card { fill: #ffffff; stroke: rgba(17, 18, 21, 0.16); stroke-width: 1; }
      .card-hi { fill: #ffffff; stroke: rgba(184, 116, 20, 0.55); stroke-width: 1.2; }
      .inner { fill: #e7e7e2; stroke: rgba(17, 18, 21, 0.14); stroke-width: 1; }
      .inner-mod { fill: #e7e7e2; stroke: rgba(184, 116, 20, 0.38); stroke-width: 1; }
      .title { font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif; font-weight: 600; fill: #111215; letter-spacing: 0.08em; }
      .block-name { font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif; font-weight: 600; font-size: 18px; fill: #111215; letter-spacing: 0.08em; }
      .mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; fill: #2c3038; font-size: 10px; }
      .mono-sm { font-family: 'JetBrains Mono', monospace; font-weight: 400; fill: #5c6470; font-size: 9px; }
      .mono-acc { font-family: 'JetBrains Mono', monospace; font-weight: 600; fill: #0e7a6d; font-size: 9.5px; }
      .mono-mod { font-family: 'JetBrains Mono', monospace; font-weight: 600; fill: #b87414; font-size: 9.5px; }
      .sig-solid { fill: none; stroke: #0e7a6d; stroke-width: 1.6; }
      .reg { font-family: 'JetBrains Mono', monospace; fill: #5c6470; font-size: 12px; opacity: 0.65; }
    </style>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0e7a6d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="620"/>
  <rect x="16" y="16" width="1068" height="588" fill="none" stroke="rgba(17, 18, 21, 0.16)" stroke-width="1"/>
  <text class="reg" x="24" y="34">+</text><text class="reg" x="1068" y="34">+</text>
  <text class="reg" x="24" y="596">+</text><text class="reg" x="1068" y="596">+</text>

  <text class="mono-mod" x="48" y="44">DD-LX04 // DMX_OUT · LUX WHITE PANEL</text>
  <text class="title" x="48" y="70" font-size="22">MODULAR CV TO DMX512-A UNIVERSE BRIDGE</text>
  <text class="mono-sm" x="1052" y="44" text-anchor="end">12 HP · 512 CHANNELS @ 44 HZ</text>
  <line x1="48" y1="84" x2="1052" y2="84" stroke="rgba(17, 18, 21, 0.20)" stroke-width="1"/>

  <!-- Left: 4 Link Ports -->
  <g transform="translate(48, 114)">
    <rect class="card" x="0" y="0" width="296" height="96"/>
    <text class="mono-acc" x="14" y="20">LINK PORT 1 (RJ45)</text>
    <text class="block-name" x="14" y="42">PATCHBAY / CUE_FRAMES</text>
    <text class="mono-sm" x="14" y="64">• Shielded Cat5e/6 · 100 kΩ · 1.46 kHz BW</text>

    <rect class="card" x="0" y="112" width="296" height="96"/>
    <text class="mono-acc" x="14" y="132">LINK PORT 2 (RJ45)</text>
    <text class="block-name" x="14" y="154">PATCHBAY / CUE_FRAMES</text>
    <text class="mono-sm" x="14" y="176">• 8 to 128 CV channels per port</text>

    <rect class="card" x="0" y="224" width="296" height="96"/>
    <text class="mono-acc" x="14" y="244">LINK PORT 3 (RJ45)</text>
    <text class="block-name" x="14" y="266">PATCHBAY / CUE_FRAMES</text>
    <text class="mono-sm" x="14" y="288">• Activity LED + dimmable stage mode</text>

    <rect class="card" x="0" y="336" width="296" height="96"/>
    <text class="mono-acc" x="14" y="356">LINK PORT 4 (RJ45)</text>
    <text class="block-name" x="14" y="378">PATCHBAY / CUE_FRAMES</text>
    <text class="mono-sm" x="14" y="400">• Combined capacity: full 512 DMX ch</text>
  </g>

  <line class="sig-solid" x1="344" y1="162" x2="416" y2="274" marker-end="url(#arrow-acc)"/>
  <line class="sig-solid" x1="344" y1="274" x2="416" y2="306" marker-end="url(#arrow-acc)"/>
  <line class="sig-solid" x1="344" y1="386" x2="416" y2="346" marker-end="url(#arrow-acc)"/>
  <line class="sig-solid" x1="344" y1="498" x2="416" y2="386" marker-end="url(#arrow-acc)"/>

  <!-- Center: CV Sampling &amp; DIP Addressing -->
  <g transform="translate(420, 148)">
    <rect class="card-hi" x="0" y="0" width="276" height="360"/>
    <text class="mono-mod" x="16" y="24">CONVERSION &amp; PATCHING</text>
    <text class="block-name" x="16" y="48">CV-TO-DMX ENGINE</text>

    <rect class="inner" x="16" y="68" width="244" height="92"/>
    <text class="mono-acc" x="28" y="88">OVERSAMPLED ADC</text>
    <text class="mono-sm" x="28" y="108">• 12-bit native → 16-bit oversampling</text>
    <text class="mono-sm" x="28" y="124">• Smooth dimmer &amp; pan/tilt sweeps</text>
    <text class="mono-sm" x="28" y="140">• +12 V rail only (−12 V unused)</text>

    <rect class="inner-mod" x="16" y="176" width="244" height="162"/>
    <text class="mono-mod" x="28" y="198">4× 9-BIT DIP ADDRESSING</text>
    <text class="mono-sm" x="28" y="218">• Bits 1–8: DMX start address / port</text>
    <text class="mono-sm" x="28" y="234">• Bit 9: TEST pattern override</text>
    <text class="mono-sm" x="28" y="258">No laptop or software needed on stage:</text>
    <text class="mono-sm" x="28" y="274">re-patch fixture addresses in seconds.</text>
    <text class="mono-acc" x="28" y="298">LED brightness switch: FULL / DIM</text>
  </g>

  <line class="sig-solid" x1="696" y1="328" x2="764" y2="328" marker-end="url(#arrow-acc)"/>

  <!-- Right: DMX Output -->
  <g transform="translate(768, 198)">
    <rect class="card-hi" x="0" y="0" width="284" height="260"/>
    <text class="mono-mod" x="16" y="24">STAGE OUTPUT</text>
    <text class="block-name" x="16" y="48">XLR-3 DMX512-A</text>
    <text class="mono-sm" x="16" y="76">• RS-485 differential line driver</text>
    <text class="mono-sm" x="16" y="94">• 250 kbit/s standard DMX512</text>
    <text class="mono-sm" x="16" y="112">• Up to 512 channels @ ≈ 44 Hz</text>
    <text class="mono-sm" x="16" y="130">• Status activity LED</text>

    <rect class="inner" x="16" y="156" width="252" height="84"/>
    <text class="mono" x="28" y="178">Drives directly:</text>
    <text class="mono-sm" x="28" y="198">Dimmers · RGBW PARs · Moving Heads</text>
    <text class="mono-sm" x="28" y="216">Strobes · Hazers · DMX Relays</text>
  </g>
</svg>