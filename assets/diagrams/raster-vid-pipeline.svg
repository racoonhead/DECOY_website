<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <style>
      .bg { fill: #0b0514; }
      .card { fill: #140a24; stroke: rgba(186, 134, 252, 0.28); stroke-width: 1; }
      .card-hi { fill: #140a24; stroke: rgba(217, 70, 239, 0.58); stroke-width: 1.2; }
      .plot { fill: #090410; stroke: rgba(186, 134, 252, 0.28); stroke-width: 0.9; }
      .title { font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif; font-weight: 600; fill: #f4ecff; letter-spacing: 0.08em; }
      .hd { font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif; font-weight: 600; fill: #f4ecff; font-size: 13px; letter-spacing: 0.07em; }
      .mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; fill: #d4c3f0; font-size: 9.5px; }
      .mono-sm { font-family: 'JetBrains Mono', monospace; font-weight: 400; fill: #9c84c4; font-size: 8.5px; }
      .mono-acc { font-family: 'JetBrains Mono', monospace; font-weight: 600; fill: #d946ef; font-size: 9.5px; }
      .mono-cy { font-family: 'JetBrains Mono', monospace; font-weight: 600; fill: #22d3ee; font-size: 9.5px; }
      .reg { font-family: 'JetBrains Mono', monospace; fill: #9c84c4; font-size: 11px; opacity: 0.55; }
    </style>
    <marker id="arr-cy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d946ef"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="620"/>
  <rect x="8" y="8" width="1084" height="604" fill="none" stroke="rgba(186, 134, 252, 0.28)" stroke-width="1"/>
  <text class="reg" x="12" y="21">+</text><text class="reg" x="1082" y="21">+</text>
  <text class="reg" x="12" y="609">+</text><text class="reg" x="1082" y="609">+</text>
  <text class="mono-acc" x="26" y="23">DD-VD01 // RASTER · CYBER PURPLE PCB</text>
  <text class="mono-sm" x="1074" y="23" text-anchor="end">16 HP · 0–1 V / 75 Ω WIDEBAND</text>
  <line x1="26" y1="29" x2="1074" y2="29" stroke="rgba(186, 134, 252, 0.28)" stroke-width="0.9"/>
  <text class="title" x="34" y="62" font-size="22">WIDEBAND 0–1 V ANALOG VIDEO SYNTHESIZER &amp; RGB COLORIZER</text>
  <line x1="34" y1="74" x2="1066" y2="74" stroke="rgba(186,134,252,0.22)" stroke-width="1"/>
  <rect class="card" x="34" y="96" width="276" height="218"/>
  <text class="mono-cy" x="50" y="118">01 // SYNC &amp; RASTER TIMING</text>
  <text class="title" x="50" y="142" font-size="18">H / V RAMP CORES</text>
  <text class="mono-sm" x="50" y="166">• H Freq: 15.625 kHz lock or free VCO</text>
  <text class="mono-sm" x="50" y="184">• V Freq: 50 / 60 Hz frame scan or CV</text>
  <text class="mono-sm" x="50" y="202">• External H/V sync from SYNC_MATRIX</text>
  <rect class="plot" x="50" y="220" width="244" height="76"/>
  <polyline fill="none" stroke="#22d3ee" stroke-width="1.6" points="60,280 120,236 120,280 180,236 180,280 240,236 240,280 284,244"/>
  <text class="mono-sm" x="62" y="236">H / V SAWTOOTH &amp; PHASE FOLD</text>
  <rect class="card" x="34" y="334" width="276" height="240"/>
  <text class="mono-acc" x="50" y="356">02 // AUDIO &amp; CV MODULATION</text>
  <text class="title" x="50" y="380" font-size="18">RACK INTERACTION</text>
  <text class="mono-sm" x="50" y="404">• AUDIO IN → horizontal scan deflection</text>
  <text class="mono-sm" x="50" y="422">• WARP CV → wavefold geometry symmetry</text>
  <text class="mono-sm" x="50" y="440">• COL CV → live palette index sweep</text>
  <text class="mono-sm" x="50" y="458">• LUMA IN → external 0–1 V brightness</text>
  <rect class="plot" x="50" y="476" width="244" height="80"/>
  <path fill="none" stroke="#d946ef" stroke-width="1.6" d="M 62 516 C 102 484 142 548 182 516 S 248 486 284 516"/>
  <line x1="310" y1="205" x2="366" y2="275" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#arr-cy)"/>
  <line x1="310" y1="454" x2="366" y2="385" stroke="#d946ef" stroke-width="1.7" marker-end="url(#arr-acc)"/>
  <rect class="card-hi" x="370" y="96" width="376" height="478"/>
  <text class="mono-acc" x="388" y="118">03 // VIDEO MATRIX &amp; 3-BAND RGB COLORIZER</text>
  <text class="title" x="388" y="142" font-size="18">SHAPING + GAMMA + HUE ROTATION</text>
  <rect class="plot" x="388" y="160" width="340" height="170"/>
  <text class="mono-cy" x="400" y="180">3-BAND WINDOW COMPARATORS → R / G / B</text>
  <rect x="404" y="196" width="308" height="28" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444"/>
  <rect x="444" y="232" width="228" height="28" fill="#4ade80" fill-opacity="0.25" stroke="#4ade80"/>
  <rect x="484" y="268" width="148" height="28" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6"/>
  <text class="mono-sm" x="412" y="214">RED GAIN / SHADOW CLIP</text>
  <text class="mono-sm" x="452" y="250">GREEN MIDTONE WINDOW</text>
  <text class="mono-sm" x="492" y="286">BLUE HIGHLIGHT BAND</text>
  <rect class="plot" x="388" y="348" width="340" height="206"/>
  <text class="mono-acc" x="400" y="368">PATTERN MODES (SHAPE SWITCH):</text>
  <text class="mono" x="400" y="392">• RAMP: Smooth H/V gradients &amp; moiré interference</text>
  <text class="mono" x="400" y="414">• TRIANGLE: Mirrored symmetry folds &amp; tunnels</text>
  <text class="mono" x="400" y="436">• BARS: Hard-edged PWM vertical/horizontal gates</text>
  <text class="mono" x="400" y="458">• CHECKER: XOR H×V grid tiles &amp; SMPTE bars</text>
  <text class="mono" x="400" y="480">• NOISE: High-speed analog/LFSR snow textures</text>
  <text class="mono-cy" x="400" y="514">GAMMA · INVERT · HUE ROTATION MATRIX</text>
  <line x1="746" y1="335" x2="796" y2="335" stroke="#d946ef" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect class="card-hi" x="800" y="160" width="266" height="350"/>
  <text class="mono-cy" x="818" y="184">04 // VIDEO OUTPUTS</text>
  <text class="title" x="818" y="208" font-size="18">0–1 V @ 75 Ω BUFFERED</text>
  <text class="mono-sm" x="818" y="234">• Direct R OUT / G OUT / B OUT (0–1 V)</text>
  <text class="mono-sm" x="818" y="254">• COMP OUT (NTSC/PAL encoded + sync)</text>
  <text class="mono-sm" x="818" y="274">• Bandwidth &gt; 15 MHz (−3 dB)</text>
  <text class="mono-sm" x="818" y="294">• Safe 75 Ω cable driving over RCA/BNC</text>
  <rect class="plot" x="818" y="320" width="230" height="168"/>
  <text class="mono-acc" x="832" y="346">CONNECTS DIRECTLY TO:</text>
  <text class="mono-sm" x="832" y="370">→ Sony PVM / BVM RGB Monitors</text>
  <text class="mono-sm" x="832" y="390">→ SYNC_MATRIX Luma Keyer</text>
  <text class="mono-sm" x="832" y="410">→ Video Capture / Scan Converter</text>
  <text class="mono-sm" x="832" y="430">→ Club Projectors &amp; LED Walls</text>
</svg>